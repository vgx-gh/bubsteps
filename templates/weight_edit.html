<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Weight - {{ app_title }}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="manifest" href="{{ url_for('static', filename='manifest.json') }}">
    <meta name="theme-color" content="#3c98a4">
    <link rel="apple-touch-icon" href="{{ url_for('static', filename='icons/apple-touch-icon.png') }}">
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => navigator.serviceWorker.register('/sw.js'));
        }
    </script>
</head>
<body>
    <div class="container">
        <h1>👣 {{ app_title }}</h1>
        {% include "_nav.html" %}

        <h2>Edit Weight Entry</h2>
        <form method="POST" class="log-form">
            <label for="entry_date">Date</label>
            <input type="date" id="entry_date" name="entry_date" value="{{ row.entry_date }}" required>

            <label for="value">Weight (kg)</label>
            <input type="number" step="any" id="value" name="value" value="{{ row.value }}" required>

            <button type="submit">Save Changes</button>
        </form>
        <a class="export-link" href="{{ url_for('weight_view') }}">← Cancel and go back</a>
    </div>
</body>
</html>
