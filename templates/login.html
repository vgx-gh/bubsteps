<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log In - BubSteps</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="manifest" href="{{ url_for('static', filename='manifest.json') }}">
    <meta name="theme-color" content="#3c98a4">
    <link rel="apple-touch-icon" href="{{ url_for('static', filename='icons/apple-touch-icon.png') }}">
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => navigator.serviceWorker.register('/sw.js'));
        }
    </script>
</head>
<body>
    <div class="container">
        <h1>👣 BubSteps</h1>

        <h2>Log In</h2>

        {% if message %}
        <p style="color:#2e7d32; font-weight:600;">✅ {{ message }}</p>
        {% endif %}

        {% if error %}
        <p style="color:#c0392b; font-weight:600;">⚠️ {{ error }}</p>
        {% endif %}

        <form method="POST" class="log-form">
            <input type="hidden" name="next" value="{{ next }}">

            <label for="email">Email</label>
            <input type="email" id="email" name="email" required autofocus>

            <label for="password">Password</label>
            <input type="password" id="password" name="password" required>

            <button type="submit">Log In</button>
        </form>

        <p style="margin-top:16px;">
            No account yet?
            <a href="{{ url_for('signup_view') }}">Sign up</a>
        </p>
    </div>
</body>
</html>
